# CI: checks every change before it can be merged or deployed.
#   - on pull requests and on pushes to any branch except main
#   - and as the first step of the Deploy pipeline (deploy.yml calls it for pushes to main)
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # A real, empty PostgreSQL so the database migrations are tested for real.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate

      - name: Migrations apply cleanly to an empty database
        run: npx prisma migrate deploy

      # Fails if schema.prisma was changed without creating a migration for it, which would
      # otherwise break the deployment (the server only runs migrations, never schema.prisma).
      - name: schema.prisma matches the migrations
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d ci -c 'CREATE DATABASE ci_shadow;'
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code

      - run: npm run build

      # Reports known vulnerabilities in dependencies. Informational for now: it shows up
      # in the log but does not stop a deployment. Remove continue-on-error to enforce it.
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Demo mode uses bundled sample data, so the build needs no running backend.
          NEXT_PUBLIC_DEMO_MODE: "true"
          # The production build refuses to run without the public URL (see src/config/site.ts).
          NEXT_PUBLIC_SITE_URL: https://app.example.com
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # Proves the production images still build, so a broken Dockerfile is found in the pull
  # request and not in the middle of a deployment. Nothing is pushed here.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.example.com
            NEXT_PUBLIC_SITE_URL=https://app.example.com
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # The installer, updater and ops scripts are what customers run on their servers, so a mistake in
  # them is expensive. shellcheck finds typos, unquoted variables and other common script bugs.
  # SC2034 (unused loop counter) and SC2154 (trap variable) are known harmless matches.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: |
          shellcheck --severity=warning --exclude=SC2034,SC2154 \
            install.sh update.sh setup-smtp.sh create-admin.sh status.sh \
            ops/backup/backup.sh ops/backup/restore.sh ops/deploy/deploy.sh

  # Starts the real stack (database and API) and walks through the first-run flow that the customer
  # package depends on: health, the web installer call, the starter categories, the admin script and a
  # login. It uses a throwaway .env with random values; nothing here is a real secret.
  stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create a throwaway .env
        run: |
          cat > .env <<EOF
          APP_DOMAIN=app.example.com
          API_DOMAIN=api.example.com
          ACME_EMAIL=ci@example.com
          POSTGRES_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -hex 32)
          SETUP_CODE=$(openssl rand -hex 12)
          EOF

      - name: Build and start the database and the API
        run: docker compose up -d --build db backend

      - name: The API becomes healthy
        run: |
          for i in $(seq 1 60); do
            state=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$(docker compose ps -q backend)")
            echo "backend: $state"
            [ "$state" = "healthy" ] && exit 0
            sleep 5
          done
          echo "The API did not become healthy in 5 minutes."
          exit 1

      - name: The web installer creates the first admin
        run: |
          out=$(docker compose exec -T backend node -e "fetch('http://localhost:3001/setup/install',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({setupCode:process.env.SETUP_CODE,name:'CI Admin',email:'ci-admin@example.com',password:'CiPass12345'})}).then(async r=>console.log(r.status,await r.text()))" </dev/null)
          echo "$out"
          echo "$out" | grep -q '^201 '

      - name: The nine starter categories (and their parent) exist
        run: |
          n=$(docker compose exec -T db psql -U autohub -d autohub -tAc 'select count(*) from "Category"' </dev/null | tr -d '[:space:]')
          echo "categories: $n"
          [ "$n" = "10" ]

      - name: create-admin.sh's script adds a second admin who can log in
        run: |
          printf '%s\n%s\n%s\n' ci-second@example.com 'Second Admin' 'CiPass12345' | docker compose exec -T backend node scripts/create-admin.js
          out=$(docker compose exec -T backend node -e "fetch('http://localhost:3001/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({email:'ci-second@example.com',password:'CiPass12345'})}).then(async r=>console.log(r.status,await r.text()))" </dev/null)
          echo "$out"
          echo "$out" | grep -q '^201 '

      - name: Show the logs if something failed
        if: failure()
        run: docker compose logs --tail 100 db backend
