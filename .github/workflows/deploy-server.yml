# Reusable: puts one image tag live on the server over SSH, then checks the live site.
# Called by deploy.yml (new release) and rollback.yml (older release).
name: Deploy to server

on:
  workflow_call:
    inputs:
      image_tag:
        description: Image tag to deploy, for example sha-1a2b3c4
        required: true
        type: string
      skip_backup:
        description: Deploy even if the automatic pre-deploy backup fails
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # The "production" environment can require a person to approve before this job runs
    # (Settings > Environments > production > Required reviewers).
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    steps:
      - name: Check the image tag
        env:
          TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$TAG" =~ ^(latest|sha-[0-9a-f]{7,40})$ ]]; then
            echo "::error::Unexpected image tag: $TAG (expected sha-1a2b3c4 or latest)"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          missing=0
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (Settings > Environments > production > Secrets)."
              missing=1
            fi
          done
          [ "$missing" = 0 ]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # The server's identity is pinned, so the deployment cannot be redirected to another machine.
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy the deployment files
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/autohub' }}
        run: |
          scp -o BatchMode=yes -i ~/.ssh/id_deploy -r docker-compose.yml deploy ops \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/autohub' }}
          TAG: ${{ inputs.image_tag }}
          SKIP_BACKUP: ${{ inputs.skip_backup && '1' || '0' }}
        run: |
          ssh -o BatchMode=yes -i ~/.ssh/id_deploy "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && chmod +x ops/backup/*.sh ops/deploy/*.sh && ALLOW_DEPLOY_WITHOUT_BACKUP=$SKIP_BACKUP ./ops/deploy/deploy.sh '$TAG'"

      - name: Check the live site
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors "$API_URL/health"
          echo
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --output /dev/null "$SITE_URL"
          echo "The site and the API both answered."

      - name: Clean up the SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
